name: oriongo_multiplatform
description: "OrionGo Platform - control multiplataforma (Android y escritorio) para monturas Orion."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Estado compartido entre vistas
  provider: ^6.1.2

  # Persistencia local (reemplaza @capacitor/preferences)
  shared_preferences: ^2.3.3

  # Modo remoto: administrador / usuario
  web_socket_channel: ^3.0.1

  # Matemática 3D del cielo estelar
  vector_math: ^2.1.4

  # Conexión con la montura en computadora (puertos serie, incluye Bluetooth SPP emparejado)
  flutter_libserialport: ^0.5.0

  # Ubicación del observador + mapa
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/img/
